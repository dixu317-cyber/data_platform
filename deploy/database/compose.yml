name: ff-companybrain-m2b

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?set POSTGRES_BOOTSTRAP_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres
          -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  neo4j:
    build:
      context: ./neo4j
    image: ff-companybrain/neo4j-m2b:5.26.28-apoc-5.26.28
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_dbms_security_procedures_allowlist: apoc.version,apoc.path.subgraphAll
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    tmpfs:
      - /logs
    networks:
      - database_internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/ff/healthcheck.sh"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  migrate:
    profiles: [stage2]
    build:
      context: ../..
      dockerfile: deploy/database/Dockerfile.migrate
    image: ff-companybrain/migrate-m2b:stage2
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    environment:
      POSTGRES_ADMIN_URL: postgresql://${POSTGRES_BOOTSTRAP_USER:-postgres}:${POSTGRES_BOOTSTRAP_PASSWORD:?set POSTGRES_BOOTSTRAP_PASSWORD}@postgres:5432/postgres
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?set IDENTITY_APP_PASSWORD}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:?set PLATFORM_APP_PASSWORD}
      NANO_APP_PASSWORD: ${NANO_APP_PASSWORD:?set NANO_APP_PASSWORD}
      AGENT_APP_PASSWORD: ${AGENT_APP_PASSWORD:?set AGENT_APP_PASSWORD}
      TRADITIONAL_APP_PASSWORD: ${TRADITIONAL_APP_PASSWORD:?set TRADITIONAL_APP_PASSWORD}
      GRAPH_APP_PASSWORD: ${GRAPH_APP_PASSWORD:?set GRAPH_APP_PASSWORD}
      IDENTITY_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/platform_identity_db
      PLATFORM_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/platform_core_db
      NANO_BRAIN_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/nano_brain_db
      AGENT_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/agent_gateway_db
      TRADITIONAL_RAG_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/traditional_rag_db
      GRAPH_RAG_MIGRATION_DATABASE_URL: postgresql://ff_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/graph_rag_db
      IDENTITY_DATABASE_URL: postgresql://ff_identity_app:${IDENTITY_APP_PASSWORD}@postgres:5432/platform_identity_db
      PLATFORM_DATABASE_URL: postgresql://ff_platform_app:${PLATFORM_APP_PASSWORD}@postgres:5432/platform_core_db
      NANO_BRAIN_DATABASE_URL: postgresql://ff_nano_app:${NANO_APP_PASSWORD}@postgres:5432/nano_brain_db
      AGENT_DATABASE_URL: postgresql://ff_agent_app:${AGENT_APP_PASSWORD}@postgres:5432/agent_gateway_db
      TRADITIONAL_RAG_DATABASE_URL: postgresql://ff_traditional_app:${TRADITIONAL_APP_PASSWORD}@postgres:5432/traditional_rag_db
      GRAPH_RAG_DATABASE_URL: postgresql://ff_graph_app:${GRAPH_APP_PASSWORD}@postgres:5432/graph_rag_db
      AGENT_CHECKPOINT_SCHEMA: langgraph
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      EMBEDDING_MODEL: qwen/qwen3-embedding-8b
      EMBEDDING_DIMENSIONS: "1024"
      GRAPH_RAG_WORKING_DIR: /tmp/ff-graph-rag
    tmpfs:
      - /tmp
    networks:
      - database_internal
    restart: "no"

volumes:
  postgres_data: {name: ff_companybrain_m2b_postgres_data}
  neo4j_data: {name: ff_companybrain_m2b_neo4j_data}

networks:
  database_internal: {name: ff-companybrain-m2b-internal, internal: true}
