[project]
name = "ff-graph-rag"
version = "0.1.0"
description = "GraphRAG module for FF-CompanyBrain"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "mcp>=1.0.0",
  "psycopg[binary]>=3.2.0",
  "psycopg_pool>=3.2.0",
  "asyncpg>=0.30.0",
  "pgvector>=0.4.0",
  "python-multipart>=0.0.9",
  "lightrag-hku==1.5.0",
  "neo4j==5.28.4",
  "openai>=1.0.0",
  "openpyxl>=3.1.5",
]

[project.scripts]
graph-rag-http = "graph_rag.http.main:main"
graph-rag-mcp = "graph_rag.mcp.server:main"
graph-rag-db-migrate = "graph_rag.db.migrations:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
